<!doctype html>
<!-- Draws the kit's sample pictures: six made-up portraits and a landscape,
     with enough light and shade to show what 1-bit dithering does. Rendered to
     images/samples/ by tools/make-samples.sh. ?n=1..6 portrait, ?n=scene. -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}svg{display:block}</style></head><body>
<script>
const n = new URLSearchParams(location.search).get('n')
const P = [
  // background, skin, hair, top, light
  ['#9ec5e8', '#f1c7a3', '#3b2a20', '#c0392b', 0.55],
  ['#f6d58b', '#8d5a3b', '#1b1411', '#2e86ab', 0.45],
  ['#b9e3c6', '#e8b48f', '#a0522d', '#6c5ce7', 0.6],
  ['#e8b8c8', '#c68863', '#2b2b2b', '#f39c12', 0.5],
  ['#c9c3f0', '#f3d2b8', '#d9a441', '#16a085', 0.65],
  ['#f2b98f', '#5e3b29', '#0f0b09', '#34495e', 0.4],
]
if (n === 'scene') {
  document.body.innerHTML = `<svg width="480" height="320" viewBox="0 0 480 320">
    <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b6fb6"/><stop offset="1" stop-color="#f6c58c"/></linearGradient>
    <radialGradient id="sun"><stop offset="0" stop-color="#fff6c8"/><stop offset="1" stop-color="#f7b53f"/></radialGradient></defs>
    <rect width="480" height="320" fill="url(#sky)"/>
    <circle cx="340" cy="120" r="46" fill="url(#sun)"/>
    <path d="M0 230 L90 140 L170 215 L260 120 L360 220 L420 170 L480 210 L480 320 L0 320Z" fill="#5d6b8a"/>
    <path d="M0 262 Q120 220 240 258 T480 250 L480 320 L0 320Z" fill="#2f5d3a"/>
    <path d="M0 292 Q160 268 300 290 T480 286 L480 320 L0 320Z" fill="#1d3b25"/>
  </svg>`
} else {
  const [bg, skin, hair, top, l] = P[(+n || 1) - 1]
  document.body.innerHTML = `<svg width="240" height="240" viewBox="0 0 240 240">
    <defs><radialGradient id="lit" cx="${l}" cy="0.35" r="0.75"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></radialGradient></defs>
    <rect width="240" height="240" fill="${bg}"/>
    <path d="M30 240 Q40 170 120 165 Q200 170 210 240Z" fill="${top}"/>
    <rect x="102" y="135" width="36" height="40" fill="${skin}"/>
    <ellipse cx="120" cy="105" rx="46" ry="54" fill="${skin}"/>
    <path d="M72 100 Q70 45 120 44 Q172 45 168 100 Q160 70 120 68 Q82 70 72 100Z" fill="${hair}"/>
    <circle cx="103" cy="108" r="5" fill="#222"/><circle cx="137" cy="108" r="5" fill="#222"/>
    <path d="M106 135 Q120 145 134 135" stroke="#6b3b2b" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect width="240" height="240" fill="url(#lit)"/>
  </svg>`
}
</script></body></html>
