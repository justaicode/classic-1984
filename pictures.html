<!doctype html>
<!-- The four picture styles side by side (README §9). Serve the folder and open
     pictures.html; ?night=1 for the night look. -->
<html lang="en" class="c84">
<head>
<meta charset="utf-8">
<title>Classic 1984 — pictures</title>
<link rel="stylesheet" href="classic-1984.css">
<style>
  body { margin: 0; padding: 18px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .note { padding: 8px 14px; border-bottom: 1px solid var(--ink); min-height: 54px; font-size: 12.5px; color: var(--c84-muted); }
  .note b { display: block; font: 13px var(--c84-display); color: var(--ink); font-weight: normal; }
  .msg { display: flex; gap: 10px; padding: 8px 14px; }
  .msg b { font: 14px var(--c84-display); font-weight: normal; }
  .msg p { margin: 2px 0 0; }
</style>
</head>
<body class="c84-desktop">
<script type="module">
  import { applyClassic, renderBitAvatar } from './classic-1984.js'
  const night = new URLSearchParams(location.search).get('night') === '1'
  applyClassic(document.documentElement, { hue: 135, strength: 0, night: true }, night)
  const people = [['MA', 'maria', 1, '#e9c7a3', '#3a2a1a', 'Morning! The proofs are in the shared folder.'],
    ['NI', 'nikos', 2, '#b9d3e8', '#1f3346', 'Καλημέρα! Θα τα κοιτάξω μέχρι το μεσημέρι.'],
    ['AL', 'alex', 3, '#d6c9ef', '#332753', 'Lunch on Friday? Vote below.']]
  const styles = [['colour', 'Colour tiles', 'Initials on each person’s colour'], ['ink', 'Ink only', 'Initials in a dotted frame'],
    ['photo', 'Real photos', 'Profile photos in colour'], ['bit', '1-bit photos', 'Profile photos as dots, like MacPaint']]
  const av = (k, [ini, , n, bg, fg]) =>
    k === 'colour' ? `<span class="c84-avatar" style="background:${bg};color:${fg}">${ini}</span>`
    : k === 'ink' ? `<span class="c84-avatar is-ink">${ini}</span>`
    : k === 'photo' ? `<span class="c84-avatar"><img src="images/samples/person-${n}.png" alt=""></span>`
    : `<span class="c84-avatar is-bit" data-photo="images/samples/person-${n}.png"></span>`
  document.body.innerHTML += styles.map(([k, t, hint]) => `<div class="c84-window">
    <div class="c84-window-bar"><span class="c84-window-title">${t}</span></div>
    <div class="note"><b>${t}</b>${hint}</div>
    ${people.map((p) => `<div class="msg">${av(k, p)}<div><b>${p[1]}</b><p class="c84-body">${p[5]}</p></div></div>`).join('')}
  </div>`).join('')
  for (const el of document.querySelectorAll('.c84-avatar.is-bit')) renderBitAvatar(el, el.dataset.photo).catch(() => {})
</script>
</body>
</html>
